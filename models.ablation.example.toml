# Reasoning-effort ablation: the same model at several effort levels, run on the
# same tasks with the same grader. A valid eval should show more effort scoring
# the same or better; if it doesn't, look for ambiguity or grader problems first.
#
# Copy to models.ablation.toml (git-ignored) and run:
#   python -m harness.run_eval --models models.ablation.toml --mode single_turn --out results/ablation
#
# Parameter names below are examples. Check each provider's current API
# reference and copy the exact names; anything under [model.settings.extra] is
# sent unchanged and recorded in every trial record.

[[model]]
label = "frontier_a_effort_low"
adapter = "anthropic"
model_id = "FILL_WITH_EXACT_MODEL_ID"
trials = 3
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
[model.settings]
max_tokens = 16000

[[model]]
label = "frontier_a_effort_high"
adapter = "anthropic"
model_id = "FILL_WITH_EXACT_MODEL_ID"
trials = 3
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
[model.settings]
max_tokens = 32000
[model.settings.extra]
thinking = { type = "enabled", budget_tokens = 16000 }

[[model]]
label = "frontier_b_effort_low"
adapter = "openai"
model_id = "FILL_WITH_EXACT_MODEL_ID"
trials = 3
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
[model.settings]
max_tokens = 16000
reasoning_effort = "low"

[[model]]
label = "frontier_b_effort_high"
adapter = "openai"
model_id = "FILL_WITH_EXACT_MODEL_ID"
trials = 3
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
[model.settings]
max_tokens = 32000
reasoning_effort = "high"
