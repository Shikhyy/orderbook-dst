# --- Optional, NOT FREE: Modal-hosted endpoint --------------------------------------
# Modal bills GPU time to your Modal credits, so the free-only guard refuses it
# unless the entry sets allow_paid = true, and budget_usd caps estimated spend
# (latency x usd_per_second; use your endpoint's real rate). Keep it in its own
# git-ignored file, e.g. models.modal.toml, and run it on purpose:
#   make run MODELS=models.modal.toml TASKS=<ids> TRIALS=1
# Proxy auth is "<token id>.<token secret>": both variables go in .env.
